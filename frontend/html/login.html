<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeFlux | Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icone">&#x1F41D;</div>
                <h1>BeeFlux</h1>
                <p>Preto e amarelo, é lucro na certa</p>
            </div>

            <!-- Formulário de Login -->
            <form id="login-form">
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@confeitaria.com" required>
                </div>

                <div class="input-group">
                    <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha secreta" required>
                </div>

                <div id="erro-mensagem" class="erro-msg hidden"></div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <a href="#">Esqueceu a senha?</a>
                <p>Ainda não tem uma conta? <a href="#" class="link-cadastro">Cadastre-se</a></p>
            </div>
        </div>
    </div>
    <script src="../js/login.js" defer></script>
</body>
</html>
