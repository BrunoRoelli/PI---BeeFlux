<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeFlux | Contatos</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icone">&#x1F41D;</div>
                <h1>Criar Conta</h1>
                <p>Junte-se ao BeeFlux e potencialize sua confeitaria</p>
            </div>

            <!-- Formulário de Cadastro -->
            <form id="cadastro-form">
                <div class="input-group">
                    <label for="nome"><i class="fa-solid fa-user"></i> Nome ou Confeitaria</label>
                    <input type="text" id="nome" placeholder="Ex: Confeitaria da esquina" required>
                </div>

                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@confeitaria.com" required>
                </div>

                <div class="input-group">
                    <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="confirma-senha"><i class="fa-solid fa-lock"></i> Confirmar Senha</label>
                    <input type="password" id="confirma-senha" placeholder="Repita sua senha" required>
                </div>

                <div id="erro-mensagem" class="erro-msg hidden"></div>

                <button type="submit" class="btn-submit-cadastro">
                    <i class="fa-solid fa-user-plus"></i> Cadastrar
                </button>
            </form>

            <div class="login-footer">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </div>
    <script src="../js/cadastro.js" defer></script>
</body>
